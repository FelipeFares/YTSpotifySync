name: CI/CD Pipeline - YTSpotifySync

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify (CI)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Restore NuGet Packages
        run: dotnet restore src/YTSpotifySync/YTSpotifySync.csproj -r win-x64

      - name: Build Solution (Release)
        run: dotnet build src/YTSpotifySync/YTSpotifySync.csproj -c Release -r win-x64 --no-restore

  publish:
    name: Publish & Artifacts (CD)
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Publish WinUI 3 Desktop App
        run: >
          dotnet publish src/YTSpotifySync/YTSpotifySync.csproj
          -c Release
          -r win-x64
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableMsixTooling=true
          -o ./publish/YTSpotifySync

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTSpotifySync-Portable-EXE
          path: ./publish/YTSpotifySync/YTSpotifySync.exe
          retention-days: 14

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/YTSpotifySync/YTSpotifySync.exe
          draft: false
          prerelease: false
          generate_release_notes: true
